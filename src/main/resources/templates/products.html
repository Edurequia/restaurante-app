<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio do Restaurante</title>
    <style>
      /* Global Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background-color: #f5f5f5;
        color: #333;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      main {
        flex: 1;
      }

      /* Header */
      header {
        background-color: #ff6b6b;
        color: white;
        padding: 15px 0;
      }

      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      nav ul {
        display: flex;
        list-style: none;
      }

      nav ul li {
        margin-left: 20px;
      }

      nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      /* Filter Buttons */
      .filter-buttons {
        margin: 20px 0;
        display: flex;
        gap: 10px;
      }

      .filter-button {
        padding: 8px 16px;
        background-color: #4dabf7;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .filter-button.active {
        background-color: #1971c2;
      }

      /* Product Cards */
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .product-card {
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
      }

      .product-card:hover {
        transform: translateY(-5px);
      }

      .product-image {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }

      .product-details {
        padding: 15px;
      }

      .product-name {
        font-size: 18px;
        margin-bottom: 8px;
      }

      .product-price {
        font-weight: bold;
        color: #ff6b6b;
        margin-bottom: 12px;
      }

      .add-to-cart {
        background-color: #ff6b6b;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }

      /* Form Styles */
      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .form-group textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        min-height: 100px;
      }

      .submit-button {
        background-color: #37b24d;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
      }

      /* Footer Styles */
      footer {
        background-color: #333;
        color: white;
        padding: 15px 0;
        margin-top: 40px;
      }

      .footer-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .footer-content p {
        margin: 0;
      }

      .admin-link {
        color: #999;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s ease;
      }

      .admin-link:hover {
        color: white;
      }

      /* Modal Styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background-color: white;
        margin: 10% auto;
        padding: 20px;
        border-radius: 8px;
        max-width: 500px;
        position: relative;
      }

      .close-modal {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        cursor: pointer;
      }

      /* Responsive Styles */
      @media (max-width: 768px) {
        .product-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 480px) {
        .product-grid {
          grid-template-columns: 1fr;
        }

        .header-content {
          flex-direction: column;
          gap: 10px;
        }

        nav ul {
          margin-top: 10px;
        }

        .footer-content {
          flex-direction: column;
          gap: 10px;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container header-content">
        <h1>App Restaurante</h1>
        <nav>
          <ul>
            <li><a th:href="@{/products}">Cardápio</a></li>
            <li>
              <a th:href="@{/cart}" id="cart-link"
                >Carrinho (<span id="cart-count">0</span>)</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="filter-buttons">
        <button class="filter-button active" data-filter="all">
          Todos os Produtos
        </button>
        <button class="filter-button" data-filter="food">Comidas</button>
        <button class="filter-button" data-filter="drink">Bebidas</button>
      </div>

      <div class="product-grid">
        <!-- Product cards will be displayed here -->
        <div
          th:each="product : ${products}"
          class="product-card"
          th:data-type="${product.type}"
        >
          <img
            th:src="${product.imageUrl}"
            th:alt="${product.name}"
            class="product-image"
          />
          <div class="product-details">
            <h3 class="product-name" th:text="${product.name}">
              Nome do Produto
            </h3>
            <p class="product-price" th:text="${'R$' + product.price}">
              R$0,00
            </p>
            <button
              class="add-to-cart"
              th:data-id="${product.id}"
              th:data-name="${product.name}"
              th:data-price="${product.price}"
            >
              Adicionar ao Carrinho
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container footer-content">
        <p>&copy; 2023 App Restaurante. Todos os direitos reservados.</p>
        <a th:href="@{/admin/login}" class="admin-link"
          >Painel do Administrador</a
        >
      </div>
    </footer>

    <div id="product-modal" class="modal">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 id="modal-product-name">Nome do Produto</h2>
        <p id="modal-product-price">R$0,00</p>
        <div class="form-group">
          <label for="product-notes">Instruções Especiais:</label>
          <textarea
            id="product-notes"
            placeholder="Ex.: Sem mostarda, queijo extra, etc."
          ></textarea>
        </div>
        <button id="add-to-cart-with-notes" class="submit-button">
          Adicionar ao Carrinho
        </button>
      </div>
    </div>

    <script th:inline="javascript">
      let cart = [];
      updateCartCount();

      document.querySelectorAll(".filter-button").forEach((button) => {
        button.addEventListener("click", () => {
          document
            .querySelector(".filter-button.active")
            .classList.remove("active");
          button.classList.add("active");

          const filter = button.getAttribute("data-filter");
          const products = document.querySelectorAll(".product-card");

          products.forEach((product) => {
            if (
              filter === "all" ||
              product.getAttribute("data-type") === filter
            ) {
              product.style.display = "block";
            } else {
              product.style.display = "none";
            }
          });
        });
      });

      const modal = document.getElementById("product-modal");
      const closeModalBtn = document.querySelector(".close-modal");
      let currentProductId, currentProductName, currentProductPrice;

      closeModalBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });

      window.addEventListener("click", (event) => {
        if (event.target === modal) {
          modal.style.display = "none";
        }
      });

      document.querySelectorAll(".add-to-cart").forEach((button) => {
        button.addEventListener("click", (event) => {
          currentProductId = button.getAttribute("data-id");
          currentProductName = button.getAttribute("data-name");
          currentProductPrice = parseFloat(button.getAttribute("data-price"));

          document.getElementById("modal-product-name").textContent =
            currentProductName;
          document.getElementById(
            "modal-product-price"
          ).textContent = `R$${currentProductPrice.toFixed(2)}`;
          document.getElementById("product-notes").value = "";

          modal.style.display = "block";
        });
      });

      document
        .getElementById("add-to-cart-with-notes")
        .addEventListener("click", () => {
          const notes = document.getElementById("product-notes").value;

          cart.push({
            id: currentProductId,
            name: currentProductName,
            price: currentProductPrice,
            notes: notes,
            quantity: 1,
          });

          fetch("/api/cart/add", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              id: currentProductId,
              name: currentProductName,
              price: currentProductPrice,
              notes: notes,
              quantity: 1,
            }),
          })
            .then((response) => {
              if (response.ok) {
                updateCartCount();
                modal.style.display = "none";
                alert(`${currentProductName} adicionado ao carrinho!`);
              }
            })
            .catch((error) => {
              console.error("Erro ao adicionar ao carrinho:", error);
            });
        });

      function updateCartCount() {
        fetch("/api/cart/count")
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("cart-count").textContent = data.count;
          })
          .catch((error) => {
            console.error("Erro ao atualizar contagem do carrinho:", error);
            document.getElementById("cart-count").textContent = cart.length;
          });
      }
    </script>
  </body>
</html>
