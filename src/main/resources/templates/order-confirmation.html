<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido Confirmado</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background-color: #f5f5f5;
        color: #333;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      main {
        flex: 1;
      }

      /* Header */
      header {
        background-color: #ff6b6b;
        color: white;
        padding: 15px 0;
      }

      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      nav ul {
        display: flex;
        list-style: none;
      }

      nav ul li {
        margin-left: 20px;
      }

      nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      /* Confirmation Styles */
      .confirmation-panel {
        background-color: white;
        border-radius: 8px;
        padding: 30px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        margin: 40px auto;
        max-width: 600px;
      }

      .confirmation-icon {
        width: 80px;
        height: 80px;
        background-color: #37b24d;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 40px;
      }

      .confirmation-title {
        font-size: 28px;
        margin-bottom: 15px;
        color: #37b24d;
      }

      .confirmation-message {
        font-size: 18px;
        margin-bottom: 25px;
      }

      .order-details {
        background-color: #f8f9fa;
        padding: 20px;
        border-radius: 4px;
        margin: 20px 0;
        text-align: left;
      }

      .order-id {
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 10px;
      }

      .action-buttons {
        margin-top: 30px;
        text-align: center;
      }

      .action-button {
        display: inline-block;
        padding: 12px 24px;
        background-color: #ff6b6b;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        min-width: 200px;
      }

      .action-button:hover {
        background-color: #fa5252;
      }

      .action-button.secondary {
        background-color: #adb5bd;
      }

      /* Footer */
      footer {
        background-color: #333;
        color: white;
        padding: 15px 0;
        margin-top: 40px;
      }

      .footer-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .footer-content p {
        margin: 0;
      }

      @media (max-width: 480px) {
        .header-content,
        .footer-content {
          flex-direction: column;
          gap: 10px;
        }

        nav ul {
          margin-top: 10px;
        }

        .action-buttons {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .action-button {
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container header-content">
        <nav>
          <ul>
            <li><a th:href="@{/products}">Cardápio</a></li>
            <li>
              <a th:href="@{/cart}" id="cart-link"
                >Carrinho (<span
                  id="cart-count"
                  th:text="${session.cart != null ? session.cart.size() : 0}"
                  >0</span
                >)</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="confirmation-panel">
        <div class="confirmation-icon">✓</div>
        <h2 class="confirmation-title">Pedido Confirmado!</h2>
        <p class="confirmation-message">
          Seu pedido foi recebido e está sendo preparado.
        </p>

        <div class="order-details">
          <p class="order-id" th:text="'Pedido #' + ${orderId}">Pedido #123</p>
          <p>Seu pedido foi realizado.</p>
        </div>

        <div class="action-buttons">
          <a th:href="@{/products}" class="action-button"
            >Continuar Comprando</a
          >
        </div>
      </div>
    </main>

    <footer>
      <div class="container footer-content">
        <a th:href="@{/admin/login}" class="admin-link"
          >Painel do Administrador</a
        >
      </div>
    </footer>
  </body>
</html>
