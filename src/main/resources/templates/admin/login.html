<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login de Administrador</title>
    <style>
      /* Global Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background-color: #f5f5f5;
        color: #333;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      /* Header */
      header {
        background-color: #ff6b6b;
        color: white;
        padding: 15px 0;
      }

      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      nav ul {
        display: flex;
        list-style: none;
      }

      nav ul li {
        margin-left: 20px;
      }

      nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      /* Admin Panel */
      .admin-panel {
        background-color: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .admin-header {
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #eee;
      }

      /* Form Styles */
      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .form-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }

      .login-form {
        max-width: 400px;
        margin: 0 auto;
      }

      .error-message {
        color: #fa5252;
        font-weight: bold;
      }

      .submit-button {
        background-color: #37b24d;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
      }

      /* Responsive Styles */
      @media (max-width: 480px) {
        .header-content {
          flex-direction: column;
          gap: 10px;
        }

        nav ul {
          margin-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container header-content">
        <h1>Burger Shot</h1>
        <nav>
          <ul>
            <li><a th:href="@{/products}">Voltar para o Cardápio</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="admin-panel">
        <div class="admin-header">
          <h2>Login de Administrador</h2>
        </div>

        <form th:action="@{/admin/login}" method="post" class="login-form">
          <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required />
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required />
          </div>

          <div class="form-group" th:if="${param.error}">
            <p class="error-message">Usuário ou senha inválidos</p>
          </div>

          <button type="submit" class="submit-button">Entrar</button>
        </form>
      </div>
    </main>
  </body>
</html>
