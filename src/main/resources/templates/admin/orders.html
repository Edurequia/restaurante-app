<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Pedidos</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial", sans-serif;
      }

      body {
        background-color: #f5f5f5;
        color: #333;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        background-color: #ff6b6b;
        color: white;
        padding: 15px 0;
      }

      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      nav ul {
        display: flex;
        list-style: none;
      }

      nav ul li {
        margin-left: 20px;
      }

      nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      .orders-panel {
        background-color: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .panel-header {
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .refresh-button {
        background-color: #4dabf7;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
      }

      .orders-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .order-card {
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border-left: 5px solid #adb5bd;
      }

      .order-card.pending {
        border-left-color: #fcc419;
      }

      .order-card.preparing {
        border-left-color: #4dabf7;
      }

      .order-card.ready {
        border-left-color: #37b24d;
      }

      .order-card.delivered {
        border-left-color: #868e96;
      }

      .order-card.cancelled {
        border-left-color: #fa5252;
      }

      .order-header {
        display: flex;
        justify-content: space-between;
        padding: 15px;
        background-color: #f8f9fa;
      }

      .order-id {
        font-weight: bold;
        font-size: 1.2em;
      }

      .order-time {
        color: #868e96;
        font-size: 0.9em;
      }

      .order-details {
        padding: 15px;
      }

      .customer-info {
        margin-bottom: 10px;
        font-weight: bold;
      }

      .order-items-list {
        list-style-type: none;
        margin: 15px 0;
        padding: 0;
      }

      .order-items-list li {
        padding: 5px 0;
      }

      .order-items-list li:before {
        content: "• ";
        color: #666;
      }

      .order-total {
        text-align: right;
        font-weight: bold;
        margin-top: 10px;
      }

      .order-actions {
        padding: 15px;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        background-color: #f8f9fa;
      }

      .order-status {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 20px;
        color: white;
        font-size: 0.85em;
      }

      .status-pending {
        background-color: #fcc419;
      }

      .status-preparing {
        background-color: #4dabf7;
      }

      .status-ready {
        background-color: #37b24d;
      }

      .status-delivered {
        background-color: #868e96;
      }

      .status-cancelled {
        background-color: #fa5252;
      }

      .action-button {
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }

      .status-button {
        background-color: #37b24d;
        color: white;
      }

      .delete-button {
        background-color: transparent;
        color: #fa5252;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border: none;
        padding: 0 5px;
      }

      .empty-orders {
        text-align: center;
        padding: 40px 20px;
        color: #868e96;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .modal-content {
        background-color: white;
        margin: 10% auto;
        padding: 20px;
        border-radius: 8px;
        width: 90%;
        max-width: 400px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
      }

      .close-modal {
        cursor: pointer;
        font-size: 1.5em;
      }

      .status-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 20px 0;
      }

      .status-option {
        display: flex;
        align-items: center;
        padding: 10px;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        cursor: pointer;
      }

      .status-option:hover {
        background-color: #f8f9fa;
      }

      .status-option input {
        margin-right: 10px;
      }

      .status-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .confirm-status {
        background-color: #37b24d;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }

      @media (max-width: 768px) {
        .orders-grid {
          grid-template-columns: 1fr;
        }

        .panel-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container header-content">
        <h1>App Restaurante - Pedidos</h1>
        <nav>
          <ul>
            <li><a th:href="@{/admin/orders}">Pedidos</a></li>
            <li><a th:href="@{/admin/products}">Produtos</a></li>
            <li><a th:href="@{/products}" target="_blank">Ver Site</a></li>
            <li><a th:href="@{/admin/logout}">Sair</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="orders-panel">
        <div class="panel-header">
          <h2>Gerenciamento de Pedidos</h2>
          <button id="refresh-button" class="refresh-button">
            Atualizar Pedidos
          </button>
        </div>

        <div class="orders-grid" id="orders-container"></div>
      </div>
    </main>

    <div id="status-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Atualizar Status do Pedido</h3>
          <span class="close-modal">&times;</span>
        </div>
        <div class="status-options">
          <label class="status-option">
            <input type="radio" name="status" value="pending" />
            <div class="status-label">
              <span
                class="status-indicator"
                style="background-color: #fcc419"
              ></span>
              <span>Pendente</span>
            </div>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="preparing" />
            <div class="status-label">
              <span
                class="status-indicator"
                style="background-color: #4dabf7"
              ></span>
              <span>Em Preparo</span>
            </div>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="ready" />
            <div class="status-label">
              <span
                class="status-indicator"
                style="background-color: #37b24d"
              ></span>
              <span>Pronto para Entrega</span>
            </div>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="delivered" />
            <div class="status-label">
              <span
                class="status-indicator"
                style="background-color: #868e96"
              ></span>
              <span>Entregue</span>
            </div>
          </label>
          <label class="status-option">
            <input type="radio" name="status" value="cancelled" />
            <div class="status-label">
              <span
                class="status-indicator"
                style="background-color: #fa5252"
              ></span>
              <span>Cancelado</span>
            </div>
          </label>
        </div>
        <button class="confirm-status">Confirmar Alteração</button>
      </div>
    </div>

    <script>
      const sampleOrders = [
        {
          id: 12345,
          time: "14:30 - 04/06/2023",
          status: "pending",
          items: [
            "X-Burger (2x)",
            "Batata Frita Grande",
            "Refrigerante 500ml (2x)",
          ],
          total: 58.48,
          customer: "Mesa 15",
        },
        {
          id: 12346,
          time: "14:15 - 04/06/2023",
          status: "delivered",
          items: ["Pizza Calabresa", "Água Mineral (2x)"],
          total: 41.9,
          customer: "Mesa 7",
        },
      ];

      const ordersContainer = document.getElementById("orders-container");
      const statusModal = document.getElementById("status-modal");
      const closeModalBtn = document.querySelector(".close-modal");
      const confirmStatusBtn = document.querySelector(".confirm-status");
      const refreshButton = document.getElementById("refresh-button");

      let currentOrderId = null;

      function renderOrders(orders) {
        if (orders.length === 0) {
          ordersContainer.innerHTML = `
            <div class="empty-orders">
              <p>Não há pedidos para exibir.</p>
              <p>Os novos pedidos aparecerão aqui automaticamente.</p>
            </div>
          `;
          return;
        }

        let ordersHTML = "";

        orders.forEach((order) => {
          let statusText = "";
          let statusClass = "";

          switch (order.status) {
            case "pending":
              statusText = "Pendente";
              statusClass = "status-pending";
              break;
            case "preparing":
              statusText = "Em Preparo";
              statusClass = "status-preparing";
              break;
            case "ready":
              statusText = "Pronto";
              statusClass = "status-ready";
              break;
            case "delivered":
              statusText = "Entregue";
              statusClass = "status-delivered";
              break;
            case "cancelled":
              statusText = "Cancelado";
              statusClass = "status-cancelled";
              break;
          }

          let itemsList = "";
          order.items.forEach((item) => {
            itemsList += `<li>${item}</li>`;
          });

          let actionButton = "";
          if (order.status === "delivered") {
            actionButton = `<button class="delete-button" data-id="${order.id}">✕</button>`;
          } else {
            actionButton = `<button class="action-button status-button" data-id="${order.id}">Atualizar Status</button>`;
          }

          ordersHTML += `
            <div class="order-card ${order.status}" data-id="${order.id}">
              <div class="order-header">
                <span class="order-id">Pedido #${order.id}</span>
                <span class="order-time">${order.time}</span>
              </div>
              <div class="order-details">
                <p class="customer-info">Cliente: ${order.customer}</p>
                <ul class="order-items-list">
                  ${itemsList}
                </ul>
                <p class="order-total">Total: R$${order.total.toFixed(2)}</p>
              </div>
              <div class="order-actions">
                <span class="order-status ${statusClass}">${statusText}</span>
                ${actionButton}
              </div>
            </div>
          `;
        });

        ordersContainer.innerHTML = ordersHTML;

        document.querySelectorAll(".status-button").forEach((button) => {
          button.addEventListener("click", handleUpdateStatus);
        });

        document.querySelectorAll(".delete-button").forEach((button) => {
          button.addEventListener("click", handleDeleteOrder);
        });
      }

      function handleUpdateStatus(event) {
        const orderId = event.target.dataset.id;
        currentOrderId = orderId;

        const order = sampleOrders.find((o) => o.id == orderId);
        if (order) {
          const statusRadio = document.querySelector(
            `input[name="status"][value="${order.status}"]`
          );
          if (statusRadio) statusRadio.checked = true;
        }

        statusModal.style.display = "block";
      }

      function handleDeleteOrder(event) {
        const orderId = event.target.dataset.id;
        if (confirm("Tem certeza que deseja remover este pedido?")) {
          const orderIndex = sampleOrders.findIndex((o) => o.id == orderId);
          if (orderIndex !== -1) {
            sampleOrders.splice(orderIndex, 1);
            renderOrders(sampleOrders);
          }
        }
      }

      function updateOrderStatus(orderId, newStatus) {
        const order = sampleOrders.find((o) => o.id == orderId);
        if (order) {
          order.status = newStatus;
          renderOrders(sampleOrders);
        }
      }

      function checkForNewOrders() {
        const newOrder = {
          id: Math.floor(10000 + Math.random() * 90000),
          time: new Date()
            .toLocaleString("pt-BR", {
              hour: "2-digit",
              minute: "2-digit",
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
            })
            .replace(",", " -"),
          status: "pending",
          items: ["X-Burger Especial", "Refrigerante Lata"],
          total: 24.9,
          customer: `Mesa ${Math.floor(1 + Math.random() * 20)}`,
        };

        sampleOrders.unshift(newOrder);
        renderOrders(sampleOrders);
      }

      function init() {
        renderOrders(sampleOrders);

        closeModalBtn.addEventListener("click", () => {
          statusModal.style.display = "none";
        });

        window.addEventListener("click", (event) => {
          if (event.target === statusModal) {
            statusModal.style.display = "none";
          }
        });

        confirmStatusBtn.addEventListener("click", () => {
          const selectedStatus = document.querySelector(
            'input[name="status"]:checked'
          );
          if (selectedStatus && currentOrderId) {
            updateOrderStatus(currentOrderId, selectedStatus.value);
            statusModal.style.display = "none";
          }
        });

        refreshButton.addEventListener("click", () => {
          refreshButton.textContent = "Verificando...";

          setTimeout(() => {
            checkForNewOrders();
            refreshButton.textContent = "Atualizar Pedidos";
          }, 1000);
        });
      }

      init();
    </script>
  </body>
</html>
